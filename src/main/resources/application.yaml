spring:
  application:
    name: authentication-api

  datasource:
      url: jdbc:postgresql://localhost:5432/authenticaton
      driver-class-name: org.postgresql.Driver
      username: ${GROUP_DB_USER:postgres}
      password: ${GROUP_DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: none

  output:
    ansi:
      enabled: NEVER

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true


jwt:
  public:
    key: classpath:authz.pub
  private:
    key: classpath:authz.pem
  expiration: 3600